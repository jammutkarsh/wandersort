definitions:
  admin.ResetResponse:
    properties:
      fileMetadataDeleted:
        type: integer
      filesDeleted:
        type: integer
      scanSessionsDeleted:
        type: integer
      userLabelsDeleted:
        type: integer
      vfsEntriesDeleted:
        type: integer
    type: object
  pipeline.FileCountResponse:
    properties:
      filesHashed:
        type: integer
      filesScanned:
        type: integer
    type: object
  pipeline.StartScanRequest:
    properties:
      rootPaths:
        items:
          type: string
        type: array
    required:
    - rootPaths
    type: object
  pipeline.StartScanResponse:
    properties:
      message:
        type: string
      scanPaths:
        items:
          type: string
        type: array
      sessionId:
        type: string
      status:
        type: string
    type: object
  vfs.ConfirmRequest:
    properties:
      tree:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
    required:
    - tree
    type: object
  vfs.ConfirmResponse:
    properties:
      message:
        type: string
      sessionId:
        type: string
      status:
        type: string
    type: object
  vfs.Node:
    properties:
      children:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
      fileCount:
        type: integer
      id:
        type: string
      name:
        type: string
      samples:
        items:
          type: string
        type: array
      suggestions:
        items:
          $ref: '#/definitions/vfs.Suggestion'
        type: array
    type: object
  vfs.Suggestion:
    properties:
      name:
        type: string
      source:
        type: string
    type: object
  vfs.TreeResponse:
    properties:
      sessionId:
        type: string
      tree:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
    type: object
info:
  contact: {}
  description: API documentation for WanderSort
  title: WanderSort API
  version: "1.0"
paths:
  /internal/v1/admin/reset:
    post:
      description: Deletes all scan sessions, file registry entries, and file metadata
        in a single transaction. Irreversible
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ResetResponse'
      summary: Reset all application data
      tags:
      - Admin
  /internal/v1/pipeline/count:
    get:
      description: Returns the number of files discovered by the scanner and the number
        hashed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pipeline.FileCountResponse'
      summary: Get combined file counts
      tags:
      - Pipeline
  /internal/v1/pipeline/start:
    post:
      consumes:
      - application/json
      description: Submit root paths to the pipeline. The API validates directories,
        removes overlapping child paths, returns the effective scanPaths, and then
        starts scanning immediately
      parameters:
      - description: Start Scan Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pipeline.StartScanRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/pipeline.StartScanResponse'
      summary: Start a new pipeline scan
      tags:
      - Pipeline
  /internal/v1/sessions/{id}/vfs:
    get:
      description: Returns the proposed destination hierarchy (folder names only)
        for a session's files, for review before the move
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vfs.TreeResponse'
      summary: Get the proposed VFS directory tree
      tags:
      - VFS
  /internal/v1/sessions/{id}/vfs/confirm:
    post:
      consumes:
      - application/json
      description: Accepts the possibly edited tree, applies renames to target paths,
        marks entries APPROVED, and remembers renamed locations for future scans
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Edited tree
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/vfs.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vfs.ConfirmResponse'
      summary: Confirm (approve/correct) the VFS directory tree
      tags:
      - VFS
swagger: "2.0"
