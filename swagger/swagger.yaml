definitions:
  db.ResetCounts:
    properties:
      fileMetadataDeleted:
        type: integer
      filesDeleted:
        type: integer
      scanSessionsDeleted:
        type: integer
      userLabelsDeleted:
        type: integer
      vfsEntriesDeleted:
        type: integer
    type: object
  server.ConfirmRequest:
    properties:
      tree:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
    required:
    - tree
    type: object
  server.ConfirmResponse:
    properties:
      message:
        type: string
      sessionId:
        type: string
      status:
        type: string
    type: object
  server.ScanRequest:
    properties:
      rootPaths:
        items:
          type: string
        type: array
    required:
    - rootPaths
    type: object
  server.ScanResponse:
    properties:
      message:
        type: string
      scanPaths:
        items:
          type: string
        type: array
      sessionId:
        type: string
      status:
        type: string
    type: object
  server.TreeResponse:
    properties:
      sessionId:
        type: string
      tree:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
    type: object
  vfs.Node:
    properties:
      children:
        items:
          $ref: '#/definitions/vfs.Node'
        type: array
      fileCount:
        type: integer
      id:
        type: string
      lat:
        description: |-
          Lat/Lon are one exemplar GPS coordinate for this node (only ever set on
          the location-depth node, from the first GPS-tagged file that landed
          there) — lets a review surface re-query the location resolver for ranked
          alternatives when the reviewer wants to correct a wrong name.
        type: number
      lon:
        type: number
      mergedIds:
        description: |-
          MergedIDs are the IDs of nodes a review-time merge folded into this one.
          They no longer appear anywhere in the tree (the reviewer sees one folder,
          which is the whole point of merging), but their files still live under
          those old paths in the DB, so Confirm must remap them here too.
        items:
          type: string
        type: array
      name:
        type: string
      samples:
        items:
          type: string
        type: array
      suggestions:
        items:
          $ref: '#/definitions/vfs.Suggestion'
        type: array
    type: object
  vfs.Suggestion:
    properties:
      name:
        type: string
      source:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for WanderSort
  title: WanderSort API
  version: "1.0"
paths:
  /internal/v1/workflow/{id}/confirm:
    post:
      consumes:
      - application/json
      description: Accepts the possibly edited tree, applies renames to target paths,
        marks entries APPROVED, and remembers renamed locations for future scans
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Edited tree
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ConfirmResponse'
      summary: Confirm (approve/correct) the VFS directory tree
      tags:
      - Workflow
  /internal/v1/workflow/{id}/tree:
    get:
      description: Returns the proposed destination hierarchy (folder names only)
        for a session's files, for review before the move
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TreeResponse'
      summary: Get the proposed VFS directory tree
      tags:
      - Workflow
  /internal/v1/workflow/reset:
    post:
      description: Deletes all scan sessions, file registry entries, and file metadata
        in a single transaction. Irreversible
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.ResetCounts'
      summary: Reset all application data
      tags:
      - Workflow
  /internal/v1/workflow/scan:
    post:
      consumes:
      - application/json
      description: Submit root paths to the pipeline. The API validates directories,
        removes overlapping child paths, returns the effective scanPaths, and then
        starts scanning immediately
      parameters:
      - description: Scan Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.ScanRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.ScanResponse'
      summary: Start a new scan
      tags:
      - Workflow
swagger: "2.0"
