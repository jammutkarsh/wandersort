name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Test with race detector
        run: make test-race

      - name: Build all platforms
        run: make build-all

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exiftool version
        id: exiftoolver
        run: |
          VERSION=$(grep -oP 'exiftoolVersion = "\K[0-9.]+' pkg/exiftool/verify.go)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          build-args: |
            EXIFTOOL_VERSION=${{ steps.exiftoolver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: false
