# GoReleaser config (OSS). Docs: https://goreleaser.com
# Build/test locally:  goreleaser release --snapshot --clean
# Real release:        push a tag `vX.Y.Z` (the release workflow runs this).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: wandersort
    main: .
    binary: wandersort
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # no build-machine paths in the binary (stack frames, error reports)
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    # Windows gets .zip instead of .tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Bare binaries for scripts/install.sh and install.ps1; no extraction step.
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Linux system packages attached to the GitHub release.
nfpms:
  - id: linux-packages
    package_name: wandersort
    formats: [deb, rpm, apk]
    maintainer: "Utkarsh Chourasia <utkarshchourasia100@gmail.com>"
    description: "Local-first media organizer and duplicate finder."
    license: AGPL-3.0-or-later
    homepage: https://github.com/jammutkarsh/wandersort
    bindir: /usr/bin

# Homebrew cask -> jammutkarsh/homebrew-tap
# Needs env TAP_GITHUB_TOKEN (PAT with contents:write on the tap repo).
homebrew_casks:
  - name: wandersort
    ids: [default]
    repository:
      owner: jammutkarsh
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jammutkarsh/wandersort
    description: "Local-first media organizer and duplicate finder"
    # Unsigned binary: strip the quarantine flag on install so Gatekeeper
    # doesn't block it. Remove once the binary is notarized.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/wandersort"]
          end

# Scoop manifest -> jammutkarsh/scoop-bucket (Windows).
scoops:
  - name: wandersort
    ids: [default]
    repository:
      owner: jammutkarsh
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jammutkarsh/wandersort
    description: "Local-first media organizer and duplicate finder."
    license: AGPL-3.0-or-later

# winget manifest -> jammutkarsh/winget-pkgs (fork), then a PR to microsoft/winget-pkgs.
winget:
  - name: wandersort
    ids: [default]
    publisher: jammutkarsh
    package_identifier: jammutkarsh.wandersort
    license: AGPL-3.0-or-later
    homepage: https://github.com/jammutkarsh/wandersort
    short_description: "Local-first media organizer and duplicate finder"
    repository:
      owner: jammutkarsh
      name: winget-pkgs
      branch: "wandersort-{{ .Version }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: jammutkarsh
    name: wandersort
